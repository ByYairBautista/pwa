<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#db4938" />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Manifest de la PWA -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Iconos -->
    <link
      rel="icon"
      sizes="72x72"
      type="image/png"
      href="./images/icons/icon-72x72.png"
    />

    <link
      rel="icon"
      sizes="96x96"
      type="image/png"
      href="./images/icons/icon-96x96.png"
    />

    <link
      rel="icon"
      sizes="128x128"
      type="image/png"
      href="./images/icons/icon-128x128.png"
    />

    <link
      rel="icon"
      sizes="144x144"
      type="image/png"
      href="./images/icons/icon-144x144.png"
    />

    <link
      rel="icon"
      sizes="152x152"
      type="image/png"
      href="./images/icons/icon-152x152.png"
    />

    <link
      rel="icon"
      sizes="192x192"
      type="image/png"
      href="./images/icons/icon-192x192.png"
    />

    <link
      rel="icon"
      sizes="384x384"
      type="image/png"
      href="./images/icons/icon-384x384.png"
    />

    <link
      rel="icon"
      sizes="512x512"
      type="image/png"
      href="./images/icons/icon-512x512.png"
    />

    <title>CoffeeShop GB</title>
  </head>

  <body>
    <main>
      <nav>
        <h1>Coffee PWA</h1>

        <ul>
          <li>
            <a href="#">Home</a>
          </li>

          <li>
            <a href="#">About</a>
          </li>

          <li>
            <a href="#">Blog</a>
          </li>
        </ul>
      </nav>

      <section class="introduccion">
        <h2>Nuestros cafés</h2>

        <p>
          Selecciona un café para conocer su origen, proceso, preparación y
          características.
        </p>
      </section>

      <div class="container" id="cafes-container"></div>
    </main>

    <!-- JavaScript -->
    <script src="./js/app.js"></script>

    <!-- Registro del Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./serviceworker.js")
            .then((registration) => {
              console.log(
                "Service Worker registrado correctamente:",
                registration.scope,
              );
            })
            .catch((error) => {
              console.error("Error registrando el Service Worker:", error);
            });
        });
      }
    </script>
  </body>
</html>
